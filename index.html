<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">

  <title>Frontend Mentor | Social links profile</title>

</head>
<body>
  
  <div class="container">
    <section class="card">
      <img src="assets/images/avatar-jessica.jpeg" alt="Jessica Randall" class="card-img">
      <div>
        <h1 class="card-name">Jessica Randall</h1>
        <p class="card-location">London, United Kingdom</p>
      </div>
      <p class="card-profession">"Front-end developer and avid reader."</p>
      <div class="card-links">
        <a href="#" class="card-link">GitHub</a>
        <a href="#" class="card-link">Frontend Mentor</a>
        <a href="#" class="card-link">LinkedIn</a>
        <a href="#" class="card-link">Twitter</a>
        <a href="#" class="card-link">Instagram</a>
      </div>

    </section>
    
    <footer class="attribution">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="https://www.frontendmentor.io/profile/thiagoBDN">ThiagoBDN</a>.
  </div>
  </footer>
</body>
</html>
